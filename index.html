function dashboard(filter=''){const q=filter.trim().toLocaleLowerCase('pt-BR'),items=state.priorities.filter(x=>`${x.title} ${x.priority} ${x.time}`.toLocaleLowerCase('pt-BR').includes(q)),done=state.priorities.filter(x=>x.done).length;$('#pageView').innerHTML=`<section class="welcome"><span class="eyebrow">Seu painel pessoal</span><h1>Bom dia, Gean</h1><p>${new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}</p></section><section class="section"><div class="section-head"><h2>Resumo do dia</h2><small>Visão geral</small></div><div class="summary-grid">${[['Tarefas',done,`/ ${state.priorities.length}`],['Compromissos','3',' hoje'],['Estudos','2h',' planejado'],['Treino','1',' sessão'],['Hábitos','4',' de 5']].map(x=>`<article class="card summary-card"><span class="label">${x[0]}</span><strong>${x[1]} <span>${x[2]}</span></strong></article>`).join('')}</div></section><div class="content-grid"><section class="section"><div class="section-head"><h2>Prioridades de hoje</h2><small>${done} de ${state.priorities.length} concluídas</small></div><div class="card priority-list">${items.length?items.map(x=>`<label class="priority-item ${x.done?'done':''}"><input class="checkbox" type="checkbox" data-id="${x.id}" ${x.done?'checked':''}><span><span class="item-title">${x.title}</span><span class="item-meta">${x.time||'Sem horário'} <b class="badge">${x.priority}</b></span></span><span class="status">${x.done?'Concluída':'Pendente'}</span></label>`).join(''):'<div class="empty">Nada encontrado.</div>'}</div></section><section class="section"><div class="section-head"><h2>Agenda do dia</h2><small>Hoje</small></div><div class="card timeline">${state.events.map(x=>`<div class="event"><span class="event-time">${x[0]}</span><div class="event-body"><strong>${x[1]}</strong><small>${x[2]}</small></div></div>`).join('')}</div></section></div><div class="bottom-grid"><section class="section"><div class="section-head"><h2>Progresso</h2><small>Atualizado agora</small></div><div class="card progress-card">${[['Estudos',65],['Água',48],['Hábitos',80],['Tarefas',Math.round(done/state.priorities.length*100)]].map(x=>`<div class="progress-row"><div class="progress-info"><span>${x[0]}</span><span>${x[1]}%</span></div><div class="progress"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div></section><section class="section"><div class="section-head"><h2>Alertas</h2><small>Requer atenção</small></div><div class="card alerts-card"><div class="alert"><i class="alert-dot warning"></i><div><strong>Conta vencendo</strong><small>Vencimento em 2 dias</small></div></div><div class="alert"><i class="alert-dot danger"></i><div><strong>Tarefa atrasada</strong><small>Revisar planejamento semanal</small></div></div><div class="alert"><i class="alert-dot success"></i><div><strong>Meta próxima do prazo</strong><small>Você está a 80% do objetivo</small></div></div></div></section></div><section class="section records"><div class="section-head"><h2>Meus registros</h2><small>Salvos neste dispositivo</small></div><div class="card" id="recordsList"></div></section></section>`;$$('.checkbox').forEach(c=>c.onchange=()=>{const item=state.priorities.find(x=>String(x.id)===c.dataset.id);if(item){item.done=c.checked;dashboard($('#searchInput').value)}});renderRecords()}
function renderRecords(){const list=$('#recordsList');if(!list)return;const records=repository.all().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));list.innerHTML=records.length?records.map(x=>{const config=types[x.type]||['Registro','•',[]],name=x.title||x.name||x.description||x.subject||config[0],date=x.date||new Date(x.createdAt).toLocaleDateString('pt-BR');return `<div class="record"><span><strong>${config[1]} ${escapeHtml(name)}</strong><small class="muted">${config[0]} · ${date}</small></span><span class="record-actions"><button class="btn btn-secondary btn-small" data-edit="${x.id}">Editar</button><button class="btn btn-danger btn-small" data-delete="${x.id}">Excluir</button></span></div>`}).join(''):'<div class="empty">Nenhum registro criado ainda. Use o botão + para começar.</div>'}
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function route(r){$$('[data-route]').forEach(x=>x.classList.toggle('active',x.dataset.route===r));if(r==='inicio'){dashboard($('#searchInput').value);return}$('#pageView').innerHTML=`<section class="module-placeholder"><span class="eyebrow">Módulo MYLIFE</span><h1>${routes[r]||'Módulo'}</h1><div class="card" style="padding:25px;margin-top:25px"><h2>Em breve</h2><p>Este espaço está preparado para receber o módulo <strong>${routes[r]||'selecionado'}</strong> nas próximas etapas.</p><button class="btn btn-secondary" data-route="inicio">Voltar para Início</button></div></section>`;$('#pageView [data-route]').onclick=()=>route('inicio')}
function fieldHtml(type,data){return types[type][2].map(f=>{const val=data[f[0]]??'';let c=f[2]==='textarea'?`<textarea class="textarea" name="${f[0]}" placeholder="${f[3]}">${escapeHtml(val)}</textarea>`:f[2]==='select'?`<select class="select" name="${f[0]}">${f[3].split('|').map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`:`<input class="input" type="${f[2]}" name="${f[0]}" value="${escapeHtml(val)}" placeholder="${f[3]}"${f[4]?' required':''}>`;return `<div class="field ${f[2]==='textarea'?'full':''}"><label>${f[1]}${f[4]?' *':''}</label>${c}</div>`}).join('')}
function openQuick(type='',record=null){const body=$('#quickBody'),back=$('#quickBackdrop');if(!type){body.innerHTML=`<div class="quick-options">${Object.entries(types).map(([key,v])=>`<button class="quick-option" data-type="${key}" type="button"><span class="option-icon">${v[1]}</span>${v[0]}</button>`).join('')}</div>`}else{const edit=Boolean(record);body.innerHTML=`<form id="recordForm"><span class="eyebrow">${edit?'Editar registro':'Novo registro'}</span><h2>${types[type][0]}</h2><div class="form-grid">${fieldHtml(type,record||{date:today()})}</div><div class="form-actions"><button class="btn btn-secondary" type="button" id="backQuick">Voltar</button><button class="btn btn-primary" type="submit">${edit?'Atualizar':'Salvar'}</button></div></form>`;$('#recordForm').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));repository.upsert({...(record||{}),id:record?.id||uid(),type,createdAt:record?.createdAt||new Date().toISOString(),...values});back.hidden=true;if(location.hash==='#inicio'||!location.hash)dashboard($('#searchInput').value);};$('#backQuick').onclick=()=>openQuick('')};back.hidden=false}
function setup(){buildNav();renderDate();dashboard();$('#desktopNav').onclick=e=>{const a=e.target.closest('[data-route]');if(a){e.preventDefault();route(a.dataset.route)}};$('.bottom-nav').onclick=e=>{const a=e.target.closest('[data-route]');if(a)route(a.dataset.route)};$('#searchInput').oninput=e=>{if(!location.hash||location.hash==='#inicio')dashboard(e.target.value)};$('#createButton').onclick=()=>openQuick();$('#profileCreate').onclick=()=>openQuick();$('#closeQuick').onclick=()=>$('#quickBackdrop').hidden=true;$('#quickBackdrop').onclick=e=>{if(e.target.id==='quickBackdrop')e.currentTarget.hidden=true};$('#quickBody').onclick=e=>{const option=e.target.closest('[data-type]');if(option)openQuick(option.dataset.type);const edit=e.target.closest('[data-edit]');if(edit){const record=repository.get(edit.dataset.edit);if(record)openQuick(record.type,record)}const del=e.target.closest('[data-delete]');if(del&&confirm('Excluir este registro?')){repository.remove(del.dataset.delete);renderRecords()}};$('#sidebarToggle').onclick=()=>{$('#sidebar').classList.toggle('collapsed');$('#appShell').classList.toggle('sidebar-collapsed')};$('#notificationButton').onclick=()=>$('#notificationPanel').hidden=!$('#notificationPanel').hidden;$('#profileButton').onclick=()=>$('#profilePanel').hidden=!$('#profilePanel').hidden;$('#themeButton').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('mylife-theme',n)};const saved=localStorage.getItem('mylife-theme');if(saved==='dark'||saved==='light')document.documentElement.dataset.theme=saved;document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#quickBackdrop').hidden=true;$('#notificationPanel').hidden=true;$('#profilePanel').hidden=true}});const initial=location.hash.slice(1);route(routes[initial]?initial:'inicio')}
setup();
</script>
</body></html>
